name: infra-profesor-ia

services:
  ollama:
    image: ollama/ollama:latest
    container_name: profesor_ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - infra_net

  postgres:
    image: postgres:16-alpine
    container_name: profesor_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ia_db}
      POSTGRES_USER: ${POSTGRES_USER:-profesor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-profesor_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - infra_net

  langfuse:
    image: langfuse/langfuse:2
    container_name: profesor_langfuse
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-profesor}:${POSTGRES_PASSWORD:-profesor_secret}@postgres:5432/${POSTGRES_DB:-ia_db}"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-profesor_secret_key_12345}"
      SALT: "${SALT:-profesor_salt_key_12345}"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - infra_net

networks:
  infra_net:
    driver: bridge

volumes:
  ollama_data:
  postgres_data:
